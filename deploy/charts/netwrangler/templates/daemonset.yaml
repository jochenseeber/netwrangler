{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "netwrangler.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netwrangler.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "netwrangler.agentSelectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      {{- with merge (deepCopy (.Values.agent.podAnnotations | default dict)) (.Values.podAnnotations | default dict) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "netwrangler.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "netwrangler.agentServiceAccountName" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            {{- include "netwrangler.agentSecurityContext" . | nindent 12 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.agent.debug }}
            - name: DEBUG
              value: "true"
            {{- end }}
            - name: NETWRANGLER_RETRY_COUNT
              value: {{ .Values.agent.retry.count | quote }}
            - name: NETWRANGLER_RETRY_DELAY
              value: {{ .Values.agent.retry.delaySeconds | quote }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shell-operator-run
              mountPath: /var/run/shell-operator
            # node-tool enters the node's mount namespace through
            # /hostfs/proc/1/ns/mnt
            - name: host-proc
              mountPath: /hostfs/proc
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: shell-operator-run
          emptyDir: {}
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
