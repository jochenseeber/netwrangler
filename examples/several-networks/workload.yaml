apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: netwrangler-several-networks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      # Run on worker nodes only. Drop this on a cluster whose control plane
      # nodes run workloads.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: netwrangler-several-networks
  labels:
    netwrangler.dev/ingress: enabled
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
    - port: 80
      protocol: TCP
  # One Service, two networks: the controller matches each address to its
  # VipNetwork by CIDR and creates one VipAddress per address, on the interface
  # of that VipNetwork (eth1 for public, eth2 for private).
  externalIPs:
    - 10.89.1.220
    - 10.89.2.220
